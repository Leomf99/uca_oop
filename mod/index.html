<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOD Example</title>
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body>
    <template id="app-layout">
      <div class="app">
        <section data-ref="navbar"></section>
        <section data-ref="main"></section>
      </div>
    </template>

    <template id="navbar">
      <nav>
        <button data-ref="home">Inicio</button>
        <button data-ref="orders">Pedidos</button>
      </nav>
    </template>

    <template id="hero">
      <section class="hero" data-ref="hero-section">
        <h1>Bienvenidos a Maker's On Demand!</h1>
        <h2>Pulsa el botón para ver nuestros productos</h2>
        <button class="hero-button" data-ref="productButton" type="button">Click aquí</button>
        <div class="heroImg-container">
          <img class="heroImg" data-ref="productImage" src="../../public/logo.jpeg" alt="Productos" />
        </div>
      </section>
    </template>

    <template id="orders">
      <section>
        <h2>Página de pedidos</h2>
        <div data-ref="orderInputSlot"></div>
        <h3>Productos</h3>
        <div data-ref="listSlot"></div>
      </section>
    </template>

    <template id="order-input">
      <div class="order">
        <input data-ref="input" type="text" placeholder="Ordena tus pedidos..." />
        <button data-ref="add">add</button>
        <span class="error" data-ref="error"></span>
      </div>
    </template>

    <template id="product-list">
      <div class="products">
        <ul data-ref="items"></ul>
      </div>
    </template>

    <template id="color-picker">
      <span class="picker">
        <span>Escoge el color</span>
        <button data-ref="left"><</button>
        <span class="color-viewer" data-ref="color"></span>
        <button data-ref="right">></button>
      </span>
    </template>

    <template id="product-view">
      <li class="product">
        <span class="view">
          <span data-ref="title"></span>
          <button data-ref="edit">editar</button>
          <button data-ref="remove">x</button>
        </span>
        <span class="edit">
          <input data-ref="input" type="text" />
          <button data-ref="save">guardar</button>
          <button data-ref="cancel">cancelar</button>
          <span class="error" data-ref="error"></span>
        </span>
      </li>
    </template>

    <div id="app"></div>

    <script type="module">
      import { AppLayout } from '../views/appLayout.js';

      new AppLayout().mount(document.querySelector('#app'));
    </script>
  </body>
</html>
